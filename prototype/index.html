<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Virtual Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: dark; }
  html, body { background: #06060c; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-mono, kbd, code { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-2px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .custom-scroll::-webkit-scrollbar { width: 10px; }
  .panel-min { min-height: 520px; }
  .custom-scroll::-webkit-scrollbar-track { background: transparent; }
  .custom-scroll::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(99,102,241,0.25), rgba(168,85,247,0.18));
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .custom-scroll::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(99,102,241,0.45), rgba(168,85,247,0.35));
    background-clip: padding-box;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Data files inlined as JSON for client use -->
<script id="space-json" type="application/json"></script>
<script id="characters-json" type="application/json"></script>
<script id="timeline-log" type="text/plain"></script>

<script>
  // Load data via fetch (works when served), with inline fallback for file:// previews
  async function loadData() {
    try {
      const [s, c, t] = await Promise.all([
        fetch('data/space.json').then(r => r.json()),
        fetch('data/characters.json').then(r => r.json()),
        fetch('data/timeline.log').then(r => r.text())
      ]);
      window.__SPACE__ = s;
      window.__CHARACTERS__ = c;
      window.__TIMELINE__ = t;
    } catch (e) {
      console.error('Data load failed', e);
    }
  }
  window.__dataReady = loadData();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/Avatar.jsx"></script>
<script type="text/babel" src="components/HoverCard.jsx"></script>
<script type="text/babel" src="components/SpaceView.jsx"></script>
<script type="text/babel" src="components/Timeline.jsx"></script>
<script type="text/babel" src="components/BurgerMenu.jsx"></script>
<script type="text/babel" src="components/App.jsx"></script>

<script type="text/babel" data-presets="env,react">
  (async () => {
    await window.__dataReady;
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  })();
</script>
</body>
</html>
